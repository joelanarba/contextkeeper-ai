version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --no-frozen-lockfile --shamefully-hoist
        build:
          commands:
            - pnpm run build
            - cp -r -L node_modules .next/ 2>/dev/null || true
            - cp -r -L ../../node_modules .next/ 2>/dev/null || true
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
