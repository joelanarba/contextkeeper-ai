version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - pnpm install --no-frozen-lockfile
    build:
      commands:
        - pnpm --filter @contextkeeper/web build
  artifacts:
    baseDirectory: apps/web/.next
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
      - apps/web/.next/cache/**/*
