version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --no-frozen-lockfile --shamefully-hoist
        build:
          commands:
            - pnpm --filter @contextkeeper/web build
            - mkdir -p .next/node_modules
            - cp -r "../../node_modules/"* .next/node_modules/ 2>/dev/null || true
            - cp -r "node_modules/"* .next/node_modules/ 2>/dev/null || true
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
